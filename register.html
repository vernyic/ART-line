</header> <section class="register-page">
<div class="register-card">

    <div class="register-icon">A</div>

    <h1>Создание аккаунта</h1>
    <p>Заполните данные сотрудника</p>

    <form>

        <input type="text"
               placeholder="Имя и фамилия"
               required>

        <input type="email"
               placeholder="Корпоративная почта"
               required>

        <input type="tel"
               placeholder="+7 (___) ___-__-__"
               required>

        <select required>
            <option value="">Выберите должность</option>
            <option>ОС</option>
            <option>РОП</option>
            <option>МОП</option>
            <option>ЛОГ</option>
            <option>Стажёр</option>
        </select>

        <input type="password"
               placeholder="Пароль"
               minlength="8"
               required>

        <label class="terms">
            <input type="checkbox" required>
            Я принимаю правила портала
        </label>

        <button type="submit">
            Зарегистрироваться →
        </button>

    </form>

</div>

</section> </main> </body> </html>
